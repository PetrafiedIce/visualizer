<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Odd One Out">
  <meta name="format-detection" content="telephone=no">
  <meta name="theme-color" content="#0d0d0f">
  <title>Odd One Out</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/icon-192.svg" type="image/svg+xml">
  <link rel="icon" href="/icons/icon-192.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="app">
    <header class="app-header">
      <div class="brand">
        <span class="logo">ODD</span>
        <span class="tagline">Odd One Out</span>
      </div>
      <div class="hud">
        <div class="hud-item">Score <span id="score">0</span></div>
        <div class="hud-item">Best <span id="best">0</span></div>
        <div class="hud-item time">⏱ <span id="time">60.0</span>s</div>
      </div>
    </header>

    <main class="stage">
      <div id="grid" class="grid" aria-label="Game board" role="grid"></div>
    </main>

    <footer class="controls">
      <button id="btn-start" class="btn primary" aria-label="Start game">Start</button>
      <button id="btn-restart" class="btn" aria-label="Restart game" disabled>Restart</button>
      <button id="btn-pause" class="btn" aria-label="Pause game" disabled>Pause</button>
      <button id="btn-mute" class="btn" aria-label="Toggle sound" data-muted="false">🔊</button>
      <button id="btn-settings" class="btn" aria-label="Open settings">⚙️</button>
    </footer>
  </div>

  <dialog id="settings-dialog">
    <form method="dialog" class="settings">
      <h2>Settings</h2>
      <label class="setting">
        <input id="toggle-colorblind" type="checkbox">
        Color-blind friendly colors
      </label>
      <label class="setting">
        <input id="toggle-haptics" type="checkbox" checked>
        Haptics (vibrate)
      </label>
      <menu>
        <button value="cancel" class="btn">Close</button>
      </menu>
    </form>
  </dialog>

  <div id="overlay" class="overlay hidden" role="dialog" aria-modal="true">
    <div class="card">
      <h1>Odd One Out</h1>
      <p>Find and tap the tile that looks slightly different from the others.</p>
      <ul class="tips">
        <li>Each correct tap increases difficulty.</li>
        <li>Wrong taps deduct time.</li>
        <li>Beat your best score!</li>
      </ul>
      <button id="overlay-start" class="btn primary">Play</button>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="/main.js" type="module"></script>
</body>
</html>
